name: APK yig'ish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Imzo kalitini tiklash (GitHub Secrets'dan)
        env:
          ALADDIN_KEYSTORE: ${{ secrets.ALADDIN_KEYSTORE }}
        run: |
          if [ -z "$ALADDIN_KEYSTORE" ]; then
            echo "::error::ALADDIN_KEYSTORE secret topilmadi. Repozitoriy Settings → Secrets → Actions bo'limiga qo'shing."
            exit 1
          fi
          echo "$ALADDIN_KEYSTORE" | base64 -d > app/aladdin.p12

      - name: APK yig'ish
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Nomini o'zgartirish
        run: cp app/build/outputs/apk/debug/app-debug.apk Aladdin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Aladdin-APK
          path: Aladdin.apk

      # Telefondan to'g'ridan-to'g'ri yuklab olish uchun "Releases" bo'limiga ham qo'yiladi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Aladdin ${{ github.run_number }}
          files: Aladdin.apk
